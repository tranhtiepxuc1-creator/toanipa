name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/cli @capacitor/ios

    - name: Prepare Web Production Directory
      run: |
        mkdir -p www
        if [ -f "index.html" ]; then
          cp index.html www/index.html
        fi

    - name: Initialize Capacitor iOS
      run: |
        if [ ! -d "ios" ]; then
          npx cap add ios
        fi
        npx cap sync ios

    - name: Build Xcode Project (Simulator Bypass)
      run: |
        # Biên dịch hướng sang SDK iphonesimulator để dập tắt hoàn toàn các lỗi Code Sign của Apple
        xcodebuild -workspace ios/App/App.xcworkspace \
                   -scheme App \
                   -configuration Release \
                   -sdk iphonesimulator \
                   CONFIGURATION_BUILD_DIR=../build_output \
                   clean build

    - name: Package App into Unsigned IPA
      run: |
        mkdir -p Payload
        # Copy file .app vừa build từ Simulator sang thư mục đóng gói
        cp -r ios/build_output/App.app Payload/ 2>/dev/null || cp -r build_output/App.app Payload/
        
        # Đóng gói thành file IPA tiêu chuẩn để cài qua TrollStore/Esign
        zip -r ToanLop3-unsigned.ipa Payload

    - name: Upload Finished IPA as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ToanLop3-Unsigned-IPA
        path: ToanLop3-unsigned.ipa
