name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/cli @capacitor/ios

    - name: Prepare Web Production Directory
      run: |
        mkdir -p www
        if [ -f "index.html" ]; then
          cp index.html www/index.html
        fi

    - name: Add iOS Platform
      run: |
        npx cap add ios || true
        npx cap sync ios

    - name: Install Pods Dependencies
      run: |
        cd ios/App
        pod install

    - name: Advanced Code Sign Bypass (Ad-Hoc Generation)
      run: |
        cd ios/App
        # Ghi đè cấu hình ép toàn bộ dự án và các thư viện liên kết chuyển sang chế độ không chứng chỉ hệ thống
        echo "CODE_SIGNING_ALLOWED = NO" >> Names.xcconfig || true
        echo "CODE_SIGNING_REQUIRED = NO" >> Names.xcconfig || true
        
        # Can thiệp sâu cấu trúc project để vô hiệu hóa cổng chặn Signing quy định trên Xcode máy chủ
        sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' App.xcodeproj/project.pbxproj || true
        sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' App.xcodeproj/project.pbxproj || true
        sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' App.xcodeproj/project.pbxproj || true

    - name: Build Xcode Project (Real Device Unsigned)
      run: |
        # Biên dịch đồng bộ truyền lệnh dập tắt khâu định danh ở cả tầng dự án chính lẫn tầng thư viện Pods
        xcodebuild -workspace ios/App/App.xcworkspace \
                   -scheme App \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   PRODUCT_BUNDLE_IDENTIFIER="com.vietnamedu.toanlop3" \
                   CONFIGURATION_BUILD_DIR=../build_output \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   clean build

    - name: Package App into Proper Unsigned IPA
      run: |
        mkdir -p Payload
        # Sao chép gói dữ liệu ứng dụng gốc chuẩn hóa kiến trúc arm64
        cp -r ios/build_output/App.app Payload/ 2>/dev/null || cp -r build_output/App.app Payload/
        zip -r ToanLop3-unsigned.ipa Payload

    - name: Upload Finished IPA as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ToanLop3-Unsigned-IPA
        path: ToanLop3-unsigned.ipa
