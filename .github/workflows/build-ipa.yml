name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Source Code
      [span_1](start_span)uses: actions/checkout@v4[span_1](end_span)

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: |
        [span_2](start_span)npm install[span_2](end_span)
        [span_3](start_span)npm install @capacitor/cli @capacitor/ios[span_3](end_span)

    - name: Prepare Web Production Directory
      run: |
        mkdir -p www
        if [ -f "index.html" ]; then
          cp index.html www/index.html
        fi

    - name: Initialize Capacitor iOS
      run: |
        if [ ! -d "ios" ]; then
          [span_4](start_span)npx cap add ios[span_4](end_span)
        fi
        [span_5](start_span)npx cap sync ios[span_5](end_span)

    - name: Install CocoaPods Dependencies
      run: |
        # Lệnh cực kỳ quan trọng để kéo framework 'Capacitor' về cho Xcode nhận diện
        cd ios/App
        pod install

    - name: Bypass Apple Code Signing Requirements
      run: |
        cd ios/App
        echo "CODE_SIGNING_ALLOWED = NO" >> Names.xcconfig 2>/dev/null || true
        
        sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' App.xcodeproj/project.pbxproj
        sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' App.xcodeproj/project.pbxproj
        sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' App.xcodeproj/project.pbxproj

    - name: Build Xcode Project (Real Device Unsigned)
      run: |
        # Đảm bảo truyền tham số build thông qua Workspace để nhận diện Pods
        xcodebuild -workspace ios/App/App.xcworkspace \
                   -scheme App \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   PRODUCT_BUNDLE_IDENTIFIER="com.vietnamedu.toanlop3" \
                   CONFIGURATION_BUILD_DIR=../build_output \
                   [span_6](start_span)clean build[span_6](end_span)

    - name: Package App into Proper Unsigned IPA
      run: |
        [span_7](start_span)mkdir -p Payload[span_7](end_span)
        [span_8](start_span)cp -r ios/build_output/App.app Payload/ 2>/dev/null || cp -r build_output/App.app Payload/[span_8](end_span)
        [span_9](start_span)zip -r ToanLop3-unsigned.ipa Payload[span_9](end_span)

    - name: Upload Finished IPA as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ToanLop3-Unsigned-IPA
        path: ToanLop3-unsigned.ipa
