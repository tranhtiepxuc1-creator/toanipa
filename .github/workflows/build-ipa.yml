name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor/cli @capacitor/ios

    - name: Prepare Web Production Directory
      run: |
        mkdir -p www
        if [ -f "index.html" ]; then
          cp index.html www/index.html
        fi

    - name: Add iOS Platform
      run: |
        npx cap add ios || true
        npx cap sync ios

    # TỰ ĐỘNG TẢI SCRIPT CHUẨN TỪ KHO XILIN/IOS-BUILD-SCRIPT VỀ CHẠY
    - name: Load and Run Xilin Build Script
      run: |
        # Tải trực tiếp script build chuẩn của xilin về máy ảo
        curl -FSsl https://raw.githubusercontent.com/xilin/ios-build-script/master/build.sh -o xilin_build.sh
        chmod +x xilin_build.sh
        
        # Cài đặt cấu hình môi trường CocoaPods cho dự án
        cd ios/App
        pod install
        
        # Sửa file cấu hình Xcode gốc để ép chế độ Unsigned (Ký lụi)
        echo "CODE_SIGNING_ALLOWED = NO" >> Names.xcconfig || true
        sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' App.xcodeproj/project.pbxproj || true
        sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' App.xcodeproj/project.pbxproj || true
        sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' App.xcodeproj/project.pbxproj || true

    - name: Build Xcode Project (Real Device Unsigned)
      run: |
        xcodebuild -workspace ios/App/App.xcworkspace \
                   -scheme App \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   PRODUCT_BUNDLE_IDENTIFIER="com.vietnamedu.toanlop3" \
                   CONFIGURATION_BUILD_DIR=../build_output \
                   clean build

    - name: Package App into Proper Unsigned IPA
      run: |
        mkdir -p Payload
        cp -r ios/build_output/App.app Payload/ 2>/dev/null || cp -r build_output/App.app Payload/
        zip -r ToanLop3-unsigned.ipa Payload

    - name: Upload Finished IPA as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ToanLop3-Unsigned-IPA
        path: ToanLop3-unsigned.ipa
